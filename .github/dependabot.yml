version: 2
# Grouped updates: one pull request per ecosystem per week instead of one per package.
# Major versions of Terraform providers and Python packages are ignored here and
# handled deliberately (they change resource schemas and APIs; see azurerm 5.x).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, security]

  - package-ecosystem: pip
    directories: [/app/api/azure, /scripts]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, security]

  - package-ecosystem: terraform
    directories: [/infra/aws, /infra/azure, /infra/bootstrap/aws, /infra/bootstrap/azure]
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
    # Dependabot's "semver-major" filter does not stop it from rewriting "~>"
    # version constraints, so the provider majors are pinned out explicitly.
    # Upgrade them in a planned change: azurerm 5 renames Cosmos DB arguments.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        versions: [">= 5.0.0"]
      - dependency-name: "hashicorp/aws"
        versions: [">= 6.0.0"]
      - dependency-name: "hashicorp/azuread"
        versions: [">= 4.0.0"]
      - dependency-name: "hashicorp/archive"
        versions: [">= 3.0.0"]
      - dependency-name: "hashicorp/random"
        versions: [">= 4.0.0"]
    labels: [dependencies, iac]
